name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository. No job here writes to it, so
# nothing needs the default token's broader scopes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The carried tests spawn real git and build real repositories in
      # mkdtemp. They are integration tests, not mocks, so the git version is
      # part of the contract: core enforces >= 2.38.0 and fails loud below it.
      - name: Record git version
        run: git --version

      # No `version:` here on purpose. action-setup errors out when pnpm is
      # specified both here and in package.json's `packageManager`, and taking
      # it from `packageManager` pins the exact 11.3.0 rather than "some 11".
      - uses: pnpm/action-setup@v4
      # Node 22, not the declared minimum of 20: pnpm 11.3.0 itself requires
      # >= 22.13 and crashes on Node 20 loading node:sqlite. This is the
      # toolchain's floor, not the package's. See the engines note below.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Install pinned Mergiraf for the required integration gate
        run: |
          cargo install --locked mergiraf --version 0.19.0
          mergiraf --version

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: false

      - name: Build pinned Go parser for H0 screening tests
        run: |
          cargo install --locked tree-sitter-cli --version 0.26.9
          mkdir -p .do-not-commit/h0-v3-tools
          git init .do-not-commit/h0-v3-tools/tree-sitter-go
          git -C .do-not-commit/h0-v3-tools/tree-sitter-go fetch --depth=1 https://github.com/tree-sitter/tree-sitter-go.git 2346a3ab1bb3857b48b29d779a1ef9799a248cd7
          git -C .do-not-commit/h0-v3-tools/tree-sitter-go checkout --detach FETCH_HEAD
          tree-sitter build .do-not-commit/h0-v3-tools/tree-sitter-go -o .do-not-commit/h0-v3-tools/go.so

      - name: Selector orchestration regression checks (no model or GPU)
        run: cd experiments/lora && python3 -m unittest test_q8_secondary test_revision test_runtime test_cross_validate

      - name: Control repair regression checks (no oracle or model)
        run: node --test experiments/lora/*.test.mjs

      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm -r build

      # The M0 gate: packages/core is an extraction, not a rewrite. If any
      # carried file differs from its recorded digest, the extraction failed
      # and the green test run above does not mean what it appears to mean.
      - name: Verify carried modules are unmodified
        run: ./scripts/verify-carried.sh

      # A gate never observed to fail is a gate whose passing means nothing.
      # This drifts the carried set both ways and requires rejection each time.
      - name: Carried-file gate rejects drift
        run: ./scripts/verify-carried-selftest.sh
